<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RM – Subscriptions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
    </style>
  </head>
  <body class="h-full bg-[var(--bg-app)] text-slate-900">
    <header class="flex items-center justify-between p-4 border-b bg-white">
      <div class="flex items-center gap-2">
        <img src="./assets/brand.svg" alt="RM" class="h-6 w-6" />
        <span class="text-lg font-semibold gradient-text">Retail Manager</span>
      </div>
      <nav class="space-x-4 text-sm">
        <a href="dashboard.html" class="hover:underline">Dashboard</a>
        <a href="inventory.html" class="hover:underline">Inventory</a>
        <a href="products.html" class="hover:underline">Products</a>
        <a href="orders.html" class="hover:underline">Orders</a>
        <a href="contacts.html" class="hover:underline">Contacts</a>
        <a href="transactions.html" class="hover:underline">Transactions</a>
        <a href="subscriptions.html" class="font-semibold text-[var(--brand-700)]">Subscriptions</a>
        <a href="reports.html" class="hover:underline">Reports</a>
        <a href="settings.html" class="hover:underline">Settings</a>
      </nav>
    </header>
    <main class="p-6">
      <h1 class="text-2xl font-semibold mb-4">Subscriptions</h1>
      <p class="mb-4 text-slate-600">Create recurring subscriptions through the NMI API.</p>
      <div class="border rounded-lg p-4 bg-white shadow mb-4">
        <form id="subscription-form" class="space-y-4">
          <div>
            <label for="amount" class="block text-sm font-medium">Plan Amount</label>
            <input type="number" id="amount" step="0.01" class="mt-1 w-full border border-slate-300 rounded-md p-2">
          </div>
          <div>
            <label for="payments" class="block text-sm font-medium">Number of Payments (0 for unlimited)</label>
            <input type="number" id="payments" value="0" class="mt-1 w-full border border-slate-300 rounded-md p-2">
          </div>
          <div>
            <label for="frequency" class="block text-sm font-medium">Frequency (days)</label>
            <input type="number" id="frequency" class="mt-1 w-full border border-slate-300 rounded-md p-2">
          </div>
          <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 bg-[var(--brand-600)] text-white rounded-md hover:bg-[var(--brand-700)]">Create Subscription</button>
        </form>
      </div>
      <pre id="subscription-output" class="p-4 bg-slate-100 rounded-md text-sm overflow-x-auto">Enter details and submit to create a subscription.</pre>
    </main>
    <script type="module">
      import { createSubscription } from './nmi.js';
      const form = document.getElementById('subscription-form');
      const output = document.getElementById('subscription-output');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const amount = document.getElementById('amount').value;
        const payments = document.getElementById('payments').value;
        const frequency = document.getElementById('frequency').value;
        if (!amount || !frequency) {
          output.textContent = 'Please enter an amount and frequency.';
          return;
        }
        output.textContent = 'Creating subscription...';
        try {
          const res = await createSubscription({ planAmount: amount, planPayments: payments || 0, frequency });
          output.textContent = JSON.stringify(res, null, 2);
        } catch (err) {
          output.textContent = 'Error: ' + err.message;
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RM – Transactions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
    </style>
  </head>
  <body class="h-full bg-[var(--bg-app)] text-slate-900">
    <header class="flex items-center justify-between p-4 border-b bg-white">
      <div class="flex items-center gap-2">
        <img src="./assets/brand.svg" alt="RM" class="h-6 w-6" />
        <span class="text-lg font-semibold gradient-text">Retail Manager</span>
      </div>
      <nav class="space-x-4 text-sm">
        <a href="dashboard.html" class="hover:underline">Dashboard</a>
        <a href="inventory.html" class="hover:underline">Inventory</a>
        <a href="products.html" class="hover:underline">Products</a>
        <a href="orders.html" class="hover:underline">Orders</a>
        <a href="contacts.html" class="hover:underline">Contacts</a>
        <a href="transactions.html" class="font-semibold text-[var(--brand-700)]">Transactions</a>
        <a href="subscriptions.html" class="hover:underline">Subscriptions</a>
        <a href="reports.html" class="hover:underline">Reports</a>
        <a href="settings.html" class="hover:underline">Settings</a>
      </nav>
    </header>
    <main class="p-6">
      <h1 class="text-2xl font-semibold mb-4">Transactions</h1>
      <p class="mb-4 text-slate-600">View and report on transactions processed through your NMI gateway. Use the date filters below to query the API.</p>
      <div class="border rounded-lg p-4 bg-white shadow mb-4">
        <form id="transactions-form" class="space-y-4">
          <div class="flex gap-4">
            <div class="flex-1">
              <label for="start-date" class="block text-sm font-medium">Start Date</label>
              <input type="date" id="start-date" class="mt-1 w-full border border-slate-300 rounded-md p-2">
            </div>
            <div class="flex-1">
              <label for="end-date" class="block text-sm font-medium">End Date</label>
              <input type="date" id="end-date" class="mt-1 w-full border border-slate-300 rounded-md p-2">
            </div>
          </div>
          <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 bg-[var(--brand-600)] text-white rounded-md hover:bg-[var(--brand-700)]">Fetch</button>
        </form>
      </div>
      <pre id="transactions-output" class="p-4 bg-slate-100 rounded-md text-sm overflow-x-auto">Select a date range to query transactions.</pre>
    </main>
    <script type="module">
      import { listTransactions } from './nmi.js';
      const form = document.getElementById('transactions-form');
      const output = document.getElementById('transactions-output');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        if (!start || !end) {
          output.textContent = 'Please select a start and end date.';
          return;
        }
        output.textContent = 'Fetching transactions...';
        try {
          const res = await listTransactions(start, end);
          output.textContent = JSON.stringify(res, null, 2);
        } catch (err) {
          output.textContent = 'Error: ' + err.message;
        }
      });
    </script>
  </body>
</html>
